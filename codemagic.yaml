workflows:
  build-macos-zip:
    name: 靶场工坊自动构建
    max_build_duration: 30
    instance_type: mac_mini_m2

    scripts:
      - name: 编译 macOS 应用
        script: |
          set -e
          xcodebuild build \
            -project "$CM_BUILD_DIR/TargetWorkshop.xcodeproj" \
            -scheme "TargetWorkshop" \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$CM_BUILD_DIR/build_output" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: 打包 ZIP
        script: |
          set -e
          APP_PATH=$(find "$CM_BUILD_DIR/build_output/Build/Products/Release" -maxdepth 1 -name "*.app" | head -1)
          mkdir -p "$CM_BUILD_DIR/output"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$CM_BUILD_DIR/output/靶场工坊.zip"

    artifacts:
      - $CM_BUILD_DIR/output/*.zip
